name: A股自动选股

on:
  schedule:
    # 周一到周五，北京时间 19:20
    # GitHub Actions 使用 UTC
    - cron: "20 11 * * 1-5"

  # 允许在 GitHub 页面手动运行
  workflow_dispatch:

jobs:
  stock-select:

    runs-on: ubuntu-latest

    steps:

      # 获取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 安装 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 执行选股
      - name: Run stock selection
        env:
          TICKFLOW_API_KEY: ${{ secrets.TICKFLOW_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

        run: |
          python stock_select.py
          
      - name: Run trend strategy
        run: |
          python trend_strategy.py



          
